<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not found — PHOSPHOR</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!--
  Cloudflare Pages serves this file, with a real 404 status, for any path that
  is not an asset. Without it Pages answers every unresolved path with
  index.html and a 200, so /index.php, /wp-login.php and any URL a crawler
  invents all became indexable duplicates of the front page.

  Self-contained on purpose: the CSS bundle is fingerprinted on every build, so
  a 404 page that linked to it would break on the next deploy.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0d10; color: #e8eaed; padding: 2rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.65;
  }
  main { max-width: 32rem; }
  .c { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
       font-size: .74rem; letter-spacing: .22em; color: #5c6672; margin: 0 0 1.1rem; }
  h1 { font-size: clamp(1.5rem, 4.5vw, 2.2rem); line-height: 1.15;
       margin: 0 0 .9rem; font-weight: 600; letter-spacing: -.02em; }
  p { margin: 0 0 1.6rem; color: #aab3bd; }
  a { display: inline-block; padding: .45rem .8rem; border-radius: 4px;
      border: 1px solid #232830; color: #e8eaed; text-decoration: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
  a:hover { border-color: #7fd4e3; color: #7fd4e3; }
  .f { margin-top: 2.5rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
       font-size: .72rem; color: #5c6672; }
</style>
</head>
<body>
<main>
  <p class="c">404</p>
  <h1>No page exists at this address.</h1>
  <p>The link may be out of date, or the address may have a typo in it.</p>
  <a href="/">Back to PHOSPHOR</a>
  <p class="f">emlphosphor.com</p>
</main>
</body>
</html>
