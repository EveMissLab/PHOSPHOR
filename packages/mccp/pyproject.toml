[project]
name = "phosphor-mccp"
version = "0.0.1"
description = "PHOSPHOR Multiscale Computational Comprehension Platform — see how a real program's execution actually happens, grounded in trace evidence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Neo.K", email = "kakon77777@gmail.com" }]
dependencies = [
    "viztracer>=1.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
    "opentelemetry-instrumentation-urllib3>=0.48b0",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "anthropic>=0.40",
    "typer>=0.13",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "requests>=2.31"]

[project.scripts]
phosphor = "phosphor_collector.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phosphor_*"]

[tool.setuptools.package-data]
phosphor_ui = ["*.html", "*.js"]
